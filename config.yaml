# 算法开关（也可用 --algorithm 覆盖）
# 已实现: ppo, q_learning, sarsa, sarsa_lambda, dyna_q, monte_carlo,
#   value_iteration, policy_iteration, dqn, double_dqn, dueling_dqn, rainbow,
#   reinforce, a2c, trpo, ddpg, td3, sac, mpc
# 未实现: a3c, impala, td0（见 docs/ALGORITHMS.md）
algorithm: ppo

env:
  max_episode_steps: 500
  angle_threshold_deg: 12.0
  x_threshold: 1.4
  force_mag: 1.0

train:
  seed: 42
  total_steps: 80000
  solved_reward: 475.0
  solved_window: 20
  save_dir: checkpoints
  log_dir: runs
  log_every: 2000
  device: cpu

ppo:
  lr: 0.0003
  rollout_steps: 2048
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  update_epochs: 10
  minibatch_size: 64
  device: cpu

q_learning: &tabular
  total_steps: 200000
  alpha: 0.1
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.02
  epsilon_decay_steps: 100000
  n_bins: [8, 8, 16, 16]
  state_low: [-1.4, -3.0, -0.22, -3.5]
  state_high: [1.4, 3.0, 0.22, 3.5]

sarsa: *tabular
sarsa_lambda:
  <<: *tabular
  lam: 0.8
dyna_q:
  <<: *tabular
  planning_steps: 10
monte_carlo: *tabular
value_iteration:
  <<: *tabular
  explore_steps: 50000
  vi_iters: 200
policy_iteration:
  <<: *tabular
  explore_steps: 50000

dqn: &dqn
  lr: 0.001
  gamma: 0.99
  batch_size: 64
  buffer_size: 50000
  start_learning: 1000
  target_update: 500
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000
  n_step: 1
  device: cpu
  total_steps: 100000

double_dqn: *dqn
dueling_dqn: *dqn
rainbow:
  <<: *dqn
  n_step: 3

reinforce:
  lr: 0.003
  gamma: 0.99
  use_baseline: true
  device: cpu

a2c:
  lr: 0.0003
  gamma: 0.99
  ent_coef: 0.01
  vf_coef: 0.5
  n_steps: 16
  device: cpu

trpo:
  gamma: 0.99
  max_kl: 0.01
  damping: 0.1
  vf_lr: 0.001
  rollout_steps: 2048
  device: cpu

ddpg:
  lr_actor: 0.001
  lr_critic: 0.001
  gamma: 0.99
  tau: 0.005
  noise_std: 0.1
  batch_size: 64
  buffer_size: 100000
  start_learning: 1000
  device: cpu
  total_steps: 100000

td3:
  lr: 0.001
  gamma: 0.99
  tau: 0.005
  policy_noise: 0.2
  noise_clip: 0.5
  exploration_noise: 0.1
  policy_delay: 2
  batch_size: 64
  buffer_size: 100000
  start_learning: 1000
  device: cpu
  total_steps: 100000

sac:
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  alpha: 0.2
  batch_size: 64
  buffer_size: 100000
  start_learning: 1000
  device: cpu
  total_steps: 100000

mpc:
  horizon: 8
  n_samples: 64
  gamma: 0.99
  explore_steps: 5000

visualize:
  port: 6008
  host: "0.0.0.0"
  checkpoint: null
